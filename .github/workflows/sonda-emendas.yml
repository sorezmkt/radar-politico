name: Sonda emendas (temporária)
on:
  push:
    branches: [emendas]
    paths: [scripts/sonda/**, .github/workflows/sonda-emendas.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/sonda/sonda_emendas.py > scripts/sonda/saida.txt 2>&1 || true
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add scripts/sonda/saida.txt scripts/sonda/amostras || true
          git commit -m "Resultado da sonda" && git push || true
