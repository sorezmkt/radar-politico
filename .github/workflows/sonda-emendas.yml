name: Sonda emendas (temporária)
on:
  push:
    branches: [emendas]
    paths: [scripts/sonda/**, .github/workflows/sonda-emendas.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/sonda/sonda_emendas.py
