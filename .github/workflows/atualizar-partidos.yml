name: Atualizar dados dos partidos e publicar

on:
  schedule:
    - cron: "41 10 * * *"   # todo dia às 07:41 (horário de Brasília); o TSE muda pouco, mas cada rodada completa as consultas de CNPJ que ficaram para trás
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-politico
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar as regras de alerta
        run: python -m unittest discover -s tests

      - name: Baixar contas partidárias do TSE e aplicar as regras de alerta
        run: python scripts/build_partidos.py

      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/partidos cache || true
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualiza dados dos partidos $(date -u +%F)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preparar site
        if: github.ref_name == 'main'
        run: |
          mkdir -p _site
          cp -r index.html deputado.html partidos.html partido.html assets data .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == 'main'
        with:
          path: _site

  publicar:
    needs: dados
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
