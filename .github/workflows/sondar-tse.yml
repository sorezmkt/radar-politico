name: Sondar arquivos do TSE (temporário)
on:
  workflow_dispatch:
  push:
    branches: [partidos]
    paths: [scripts/sondar_tse.py, .github/workflows/sondar-tse.yml]
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/sondar_tse.py
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add sondagem && git commit -m "Resultado da sondagem do TSE" && git push
